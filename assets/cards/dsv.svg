<svg xmlns="http://www.w3.org/2000/svg" width="420" height="240" viewBox="0 0 420 240" role="img" aria-label="DSV: a dataset moves through versions v1, v2 and v3, each tracking data, preprocessing, params and metrics.">
  <style>
    text{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
    .t{fill:#e6edf3}.m{fill:#8b949e}
    .a{animation:9s linear infinite}
    @keyframes l1{0%{stroke-dashoffset:100}17.78%{stroke-dashoffset:100}25.56%{stroke-dashoffset:0}92.22%{stroke-dashoffset:0;opacity:1}95.56%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes l2{0%{stroke-dashoffset:100}41.11%{stroke-dashoffset:100}48.89%{stroke-dashoffset:0}92.22%{stroke-dashoffset:0;opacity:1}95.56%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes head{0%{opacity:0}3.33%{opacity:0}6.67%{opacity:1}92.22%{opacity:1}95.56%{opacity:0}100%{opacity:0}}
    @keyframes move{0%{transform:translateX(0)}25.56%{transform:translateX(0)}30%{transform:translateX(132px)}48.89%{transform:translateX(132px)}53.33%{transform:translateX(268px)}100%{transform:translateX(268px)}}
    @keyframes ok{0%{opacity:0}63.33%{opacity:0}66.67%{opacity:1}92.22%{opacity:1}95.56%{opacity:0}100%{opacity:0}}
    @keyframes n0{0%{opacity:0}3.33%{opacity:0}6.67%{opacity:1}92.22%{opacity:1}95.56%{opacity:0}100%{opacity:0}}
    @keyframes c0{0%{opacity:0}7.78%{opacity:0}11.11%{opacity:1}92.22%{opacity:1}95.56%{opacity:0}100%{opacity:0}}
    @keyframes n1{0%{opacity:0}25.56%{opacity:0}28.89%{opacity:1}92.22%{opacity:1}95.56%{opacity:0}100%{opacity:0}}
    @keyframes c1{0%{opacity:0}31.11%{opacity:0}34.44%{opacity:1}92.22%{opacity:1}95.56%{opacity:0}100%{opacity:0}}
    @keyframes n2{0%{opacity:0}48.89%{opacity:0}52.22%{opacity:1}92.22%{opacity:1}95.56%{opacity:0}100%{opacity:0}}
    @keyframes c2{0%{opacity:0}54.44%{opacity:0}57.78%{opacity:1}92.22%{opacity:1}95.56%{opacity:0}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#bb9af7" stroke-opacity=".05"/></pattern>
  </defs>
  <rect x=".5" y=".5" width="419" height="239" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect x="1" y="45" width="418" height="194" fill="url(#g)"/>
  <rect x="20" y="17" width="12" height="12" rx="3.5" fill="#bb9af7"/>
  <text x="42" y="28" class="t" font-size="14" font-weight="700">DSV</text>
  <text x="400" y="28" class="m" font-size="11" text-anchor="end">dataset versioning</text>
  <line x1="1" x2="419" y1="44.5" y2="44.5" stroke="#30363d"/>
  <g font-size="11">
    <path d="M86 112H326" stroke="#30363d" stroke-width="1.5" stroke-dasharray="3 5"/>
    <path class="a" style="animation-name:l1" d="M86 112H190" pathLength="100" stroke-dasharray="100" stroke="#2ac3de" stroke-width="2"/>
    <path class="a" style="animation-name:l2" d="M218 112H326" pathLength="100" stroke-dasharray="100" stroke="#bb9af7" stroke-width="2"/>
    <g class="a" style="animation-name:n0">
      <circle cx="72" cy="112" r="14" fill="#161b22" stroke="#2ac3de" stroke-width="1.5"/>
      <text x="72" y="116" text-anchor="middle" fill="#2ac3de" font-weight="700">v1</text>
    </g>
    <g class="a" style="animation-name:c0">
      <path d="M72 126V140" stroke="#30363d" stroke-width="1.5"/>
      <rect x="30" y="140" width="84" height="22" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="72" y="155" text-anchor="middle" class="t" font-size="10">raw dataset</text>
    </g>
    <g class="a" style="animation-name:n1">
      <circle cx="204" cy="112" r="14" fill="#161b22" stroke="#bb9af7" stroke-width="1.5"/>
      <text x="204" y="116" text-anchor="middle" fill="#bb9af7" font-weight="700">v2</text>
    </g>
    <g class="a" style="animation-name:c1">
      <path d="M204 126V140" stroke="#30363d" stroke-width="1.5"/>
      <rect x="150" y="140" width="108" height="22" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="204" y="155" text-anchor="middle" class="t" font-size="10">+ preprocessing</text>
    </g>
    <g class="a" style="animation-name:n2">
      <circle cx="340" cy="112" r="14" fill="#161b22" stroke="#9ece6a" stroke-width="1.5"/>
      <text x="340" y="116" text-anchor="middle" fill="#9ece6a" font-weight="700">v3</text>
    </g>
    <g class="a" style="animation-name:c2">
      <path d="M340 126V140" stroke="#30363d" stroke-width="1.5"/>
      <rect x="278" y="140" width="124" height="22" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="340" y="155" text-anchor="middle" class="t" font-size="10">+ params · metrics</text>
    </g>
    <g class="a" style="animation-name:head"><g class="a" style="animation-name:move;animation-timing-function:ease-in-out">
      <rect x="50" y="66" width="44" height="18" rx="9" fill="#ff9e64"/>
      <text x="72" y="79" text-anchor="middle" fill="#0d1117" font-size="10" font-weight="700">HEAD</text>
      <path d="M68 84L72 90L76 84Z" fill="#ff9e64"/>
    </g></g>
    <g class="a" style="animation-name:ok">
      <circle cx="27" cy="208" r="7" fill="none" stroke="#9ece6a" stroke-width="1.5"/>
      <path d="M23.5 208L26 210.5L30.5 205.5" fill="none" stroke="#9ece6a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="42" y="212" fill="#9ece6a">every run reproducible</text>
    </g>
    <text x="400" y="212" text-anchor="end" class="m" font-size="10">file-first · no heavy infra</text>
  </g>
</svg>
